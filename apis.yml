apis:
- aid: commure:commure-fhir-api
  name: Commure FHIR API
  description: >-
    The HL7 FHIR REST API of the Commure Developer Platform, together with its
    OpenID Connect / SMART App Launch authentication surface. Covers the FHIR
    RESTful interactions (read, vread, update, delete, create, search, history,
    batch/transaction), the terminology operations ($lookup, $validate-code,
    $subsumes, $translate, $expand, $closure), the conformance operations
    ($subset, $implements, $conforms, $snapshot, $transform), the record
    operations ($everything on Patient/Encounter/Group/MedicinalProduct), FHIR
    Bulk Data ($export, $import, $bulk-delete, $async-status, $async-cancel) and
    two Commure extensions ($commure-json-patch, $fhir-patch). Access is gated
    behind the Commure Developer User Agreement; the tenant hosts described by
    the published contract no longer resolve publicly.
  humanURL: https://www.postman.com/commure/commure/documentation/vp76tv7/commure-fhir-api
  baseURL: https://api-{tenant-id}.developer.commure.com
