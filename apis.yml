name: Commure
kind: company
description: >-
  Commure is a San Francisco-based AI-native healthcare technology company that
  operates an integrated clinical and operational platform for United States
  health systems following its 2023 combination with Athelas. Its products span
  Ambient AI clinical documentation (Scribe/Dictation), end-to-end Revenue Cycle
  Management (RCM), Call Center Agents, referral Orchestrator, patient Engage
  coordination, Commure Pro clinical intelligence, Strongline staff-safety
  alerting, and Athelas Home point-of-care diagnostics, integrating with 60+
  EHRs across 130+ health systems processing over $25B in annual claims. Commure
  launched a FHIR-native open developer platform in 2020, but that public
  developer portal (developer.commure.com) is no longer live; today the API
  surface is a gated, partner-only offering governed by a Developer User
  Agreement (Sandbox Environment + Developer Services), with no self-serve
  public API documentation, FHIR CapabilityStatement, or downloadable OpenAPI
  currently published. Home market is the United States.
