model: hl7-fhir
summary: >-
  The Commure Developer Platform stores and exposes HL7 FHIR resources, so the data model is
  FHIR's own. The REST surface is type-parameterised (/api/v1/{fhir_version}/{type}/{id}), which
  means the OpenAPI does not enumerate resource types; the entities and relationships below are
  derived from the FHIR resources Commure actually exercises in its published Postman collections
  (request paths, example payloads and Reference targets), plus the resource types that have
  dedicated operations in the contract.
identity:
  resource_id: FHIR logical id (server-assigned string), addressed as {type}/{id}
  version_id: FHIR meta.versionId, surfaced as a weak ETag and addressable at /_history/{vid}
  references: 'FHIR Reference.reference, e.g. {"reference": "Patient/1234"}'
  no_id_prefixes: Commure does not publish typed id prefixes; ids are opaque FHIR logical ids.
