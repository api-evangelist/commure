summary: >-
  Commure published a first-party JavaScript/TypeScript SDK and component suite under the npm
  scope @commure, but NOT on the public npm registry. Every package resolves to
  https://npm.developer.commure.com/, a private authenticated registry Commure operated as part
  of the Commure Developer Platform. Commure's own public demo application
  (github.com/commure/patient-chart-demo-app, the finished result of its "Patient Chart Demo App"
  tutorial) pins 33 @commure packages at version 0.1.12 and instructs developers to "make sure you
  have your yarn settings configured to pull @commure packages from the appropriate (authenticated)
  registry, per the Account Setup instructions". Both the private registry host
  (npm.developer.commure.com) and the account-setup docs host (staging.developer.commure.com) are
  now NXDOMAIN, and every @commure package name 404s on registry.npmjs.org. The SDK is therefore
  real, first-party and dated, but no longer obtainable by anyone.
