sdk_pointer_withheld:
  reason: >-
    No `type: SDKs` pointer is emitted in apis.yml. The SDK check asks whether a developer can
    obtain and use a first-party client library; here the answer is no on every registry probed.
    Recording these as shipping SDKs would credit Commure with a client surface that cannot be
    installed. The packages are recorded under `type: Packages` instead, which is the honest
    claim: they existed, they were first-party, and here is exactly what happened to them.
