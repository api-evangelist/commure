- id: rfc9728-protected-resource-metadata
  name: 'RFC 9728 OAuth 2.0 Protected Resource Metadata'
  conforms: false
  method: probed
  evidence: >-
    /.well-known/oauth-protected-resource returns HTTP 405 on accounts.commure.com and 404 on
