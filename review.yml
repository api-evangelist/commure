actions:
  apisYmlUpdated: true
  reason: |
    No live public developer portal, API reference, FHIR CapabilityStatement,
    SMART configuration, or downloadable OpenAPI was found. The apis.yml
    captures Commure's identity and verified website/legal/status/trust
    surfaces, with an empty apis[] list because there is no self-serve public
    API to catalog - only a gated, partner-only Developer Services offering.
