summary: >-
  Commure DOES serve /.well-known/ discovery documents - but on its identity host
  accounts.commure.com, not on the corporate site and not on the retired developer platform.
  accounts.commure.com is an Okta Customer Identity org operating under Commure's own domain and
  is the sign-in surface already linked from apis.yml (SignUp/Login). It answers
  /.well-known/openid-configuration, /.well-known/oauth-authorization-server (RFC 8414) and
  /oauth2/default/.well-known/openid-configuration with real JSON metadata documents, all three
  saved verbatim in this directory. The corporate site www.commure.com still answers every
  /.well-known/* path with a genuine HTTP 404 (text/html) - not an SPA catch-all 200 - so those
  remain true negatives. The two discovery documents Commure's published FHIR contract defines
  (the tenant OpenID Connect metadata and the SMART App Launch configuration) live on the tenant
  API hosts, which still do not resolve.
caveat: >-
  accounts.commure.com is a delegated identity surface (Okta), so the okta.* scopes it advertises
  are Okta platform management scopes present in every Okta org, NOT Commure product API scopes.
  The only Commure-configured custom scopes visible anonymously are on the `default` custom
  authorization server: `default`, `interclient_access`, `device_sso`, `groups`. This document is
  a real, machine-readable auth-discovery surface for Commure's products; it is not a discovery
  document for the FHIR Developer Platform.
