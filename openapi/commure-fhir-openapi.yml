  /api/v1/{fhir_version}/Patient/$everything:
    get:
      operationId: fetchPatientRecord
      summary: Fetch Patient Record
      description: "This operation is used to return all the information related to one or more patients\
        \ described in the resource or context on which this operation is invoked. The response is a bundle\
        \ of type \"searchset\". At a minimum, the patient resource(s) itself is returned, along with\
        \ any other resources that the server has that are related to the patient(s), and that are available\
        \ for the given user. The server also returns whatever resources are needed to support the records\
        \ - e.g. linked practitioners, medications, locations, organizations etc.   \n\nThe intended use\
        \ for this operation is to provide a patient with access to their entire record (e.g. \"Blue Button\"\
        ), or for provider or other user to perform a bulk data download.  The server SHOULD return at\
        \ least all resources that it has that are in the patient compartment for the identified patient(s),\
        \ and any resource referenced from those, including binaries and attachments. In the US Realm,\
        \ at a minimum, the resources returned SHALL include all the data covered by the meaningful use\
        \ common data elements as defined in the US Core Implementation Guide. Other applicable implementation\
        \ guides may make additional rules about how much information that is returned."
      tags:
      - FHIR
      parameters:
      - name: fhir_version
        in: path
        required: true
        description: (Required) Version of the FHIR
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: The date range relates to care dates, not record currency dates - e.g. all records
          relating to care provided in a certain date range. If no start date is provided, all records
          prior to the end date are in scope.
        schema:
          type: string
          format: date
      - name: end
        in: query
        required: false
        description: The date range relates to care dates, not record currency dates - e.g. all records
          relating to care provided in a certain date range. If no end date is provided, all records subsequent
          to the start date are in scope.
        schema:
          type: string
          format: date
      - name: _since
        in: query
        required: false
        description: Resources updated after this period will be included in the response. The intent
          of this parameter is to allow a client to request only records that have changed since the last
          request, based on either the return header time, or or (for asynchronous use), the transaction
          time
        schema:
          type: string
          format: date-time
      - name: _type
        in: query
        required: false
        description: One or more parameters, each containing one or more comma-delimited FHIR resource
          types to include in the return resources. In the absence of any specified types, the server
          returns all resource types
        schema:
          type: string
      - name: _count
        in: query
        required: false
        description: See discussion below on the utility of paging through the results of the $everything
          operation
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/fhir+json:
              schema:
                type: object
        '500':
          description: Internal Server Error
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
      security:
      - SMARTonFHIR: []
      - bearerAuth: []
