  /api/v1/{fhir_version}/CodeSystem/{id}/$validate-code:
    post:
      operationId: codeSystemBasedValidation
      summary: Code System based Validation
      description: 'Validate that a coded value is in the code system. If the operation is not called at the instance level, one of the parameters "url" or "codeSystem" must be provided. The operation returns a result (true / false), an error message, and the recommended display for the code.


        When invoking this operation, a client SHALL provide one (and only one) of the parameters (code+system, coding, or codeableConcept). Other parameters (including version and display) are optional'
      tags:
      - FHIR
      parameters:
      - name: fhir_version
        in: path
        required: true
        description: (Required) Version of the FHIR
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: (Required) id of the instance
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              type: object
              description: FHIR resource or Parameters resource
      responses:
        '200':
          description: OK
          content:
            application/fhir+json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '404':
          description: Not Found
          content:
            application/fhir+json:
