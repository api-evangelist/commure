        schema:
          type: string
      - name: id
        in: path
        required: true
        description: (Required) the Logical Id of a resource
        schema:
          type: string
      - name: Etag
        in: header
        required: false
        description: header containing the Version Id of a resource (e.g. W/'23')
        schema:
          type: string
      - name: If-Modified-Since
        in: header
        required: false
        description: header indicating a conditional read, if used client SHALL accept a 304 Not Modified response
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: header indicating a conditional read, if used client SHALL accept a 304 Not Modified response
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/fhir+json:
              schema:
                type: object
        '304':
          description: Not Modified
          content:
            application/fhir+json:
              schema:
                type: object
        '404':
          description: Not Found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '410':
          description: Gone
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
      security:
