openapi: 3.2.0
info:
  title: Commure FHIR API
  version: v1
  summary: HL7 FHIR REST API and SMART App Launch / OpenID Connect authentication surface of the Commure Developer Platform.
  description: Derived verbatim from Commure's first-party PUBLIC Postman collection "Commure FHIR API" (https://www.postman.com/commure/commure/collection/8745312-3d47dab4-e5ff-4e53-85fd-e53659614b24).
  contact:
    name: Commure Developer Support
    email: dev-support@commure.com
  x-origin:
  - format: postman
    version: 2.1.0
    url: https://www.postman.com/collections/8745312-3d47dab4-e5ff-4e53-85fd-e53659614b24
    converter: api-evangelist enrichment pipeline (postman->openapi)
servers:
- url: https://api-{tenant-id}.developer.commure.com
  description: Tenant-scoped Commure Developer Platform host (per Commure's published Postman collection). Currently non-resolving.
  variables:
    tenant-id:
      default: tenant-id
      description: Tenant identifier, the suffix on the dashboard URL when signed in to the Commure Developer Platform.
security:
- SMARTonFHIR: []
- bearerAuth: []
tags:
- name: FHIR
paths:
  /api/v1/{fhir_version}/{type}/{id}/_history:
    get:
      operationId: getVersionHistoryResource
      summary: Get the version history of a resource
      tags:
      - FHIR
      parameters:
      - name: fhir_version
        in: path
        required: true
        description: (Required) The version of the FHIR specification that this CapabilityStatement describes (which SHALL be the same as the FHIR version of the CapabilityStatement itself). There is no default value.
        schema:
          type: string
      - name: type
        in: path
        required: true
        description: (Required) the name of a resource type (e.g. 'Patient')
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: (Required) the Logical Id of a resource
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/fhir+json:
              schema:
                type: object
      security:
      - SMARTonFHIR: []
      - bearerAuth: []
  /api/v1/{fhir_version}/{type}/{id}/_history/{vid}:
    get:
      operationId: getSpecificVersionResource
      summary: Get a specific version of a resource
      tags:
      - FHIR
      parameters:
      - name: fhir_version
        in: path
        required: true
        description: (Required) The version of the FHIR specification that this CapabilityStatement describes (which SHALL be the same as the FHIR version of the CapabilityStatement itself). There is no default value.
        schema:
          type: string
      - name: type
        in: path
        required: true
        description: (Required) the name of a resource type (e.g. 'Patient')
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: (Required) the Logical Id of a resource
        schema:
          type: string
      - name: vid
        in: path
        required: true
        description: (Required) the Version Id of a resource
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/fhir+json:
              schema:
                type: object
        '404':
          description: Not Found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '410':
          description: Gone
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
      security:
      - SMARTonFHIR: []
      - bearerAuth: []
  /api/v1/{fhir_version}/{type}/{id}:
    get:
      operationId: getResource
      summary: Get a resource
      tags:
