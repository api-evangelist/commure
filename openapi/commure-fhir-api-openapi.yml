        schema:
          type: string
      - name: type
        in: path
        required: true
        description: (Required) the name of a resource type (e.g. 'Patient')
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: (Required) the Logical Id of a resource
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        description: header indicating a conditional read, if used client SHALL accept a 304 Not Modified response
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              type: object
              description: FHIR resource or Parameters resource
      responses:
        '200':
          description: OK
          content:
            application/fhir+json:
              schema:
                type: object
        '201':
          description: Created
          content:
            application/fhir+json:
              schema:
                type: object
        '304':
          description: Not Modified
          content:
            application/fhir+json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '401':
          description: Unauthorized
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '404':
          description: Not Found
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '405':
          description: Method Not Allowed
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '409':
          description: Conflict
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '412':
          description: Precondition Failed
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '422':
          description: Unprocessable Entity
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
      security:
      - SMARTonFHIR: []
      - bearerAuth: []
    delete:
      operationId: deleteResource
      summary: Delete a resource
      tags:
      - FHIR
      parameters:
      - name: fhir_version
        in: path
        required: true
        description: (Required) The version of the FHIR specification that this CapabilityStatement describes (which SHALL be the same as the FHIR version of the CapabilityStatement itself). There is no default value.
        schema:
          type: string
      - name: type
        in: path
        required: true
        description: (Required) the name of a resource type (e.g. 'Patient')
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: (Required) the Logical Id of a resource
        schema:
          type: string
      - name: search parameters
        in: query
        required: false
        description: optional search parameters for conditional delete
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/fhir+json:
              schema:
                type: object
        '204':
          description: No Content
          content:
            application/fhir+json:
              schema:
                type: object
        '405':
          description: Method Not Allowed
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '409':
          description: Conflict
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
        '412':
          description: Precondition Failed
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
      security:
      - SMARTonFHIR: []
      - bearerAuth: []
  /api/v1/{fhir_version}/{type}/{id}/$fhir-patch:
    post:
      operationId: applyFHIRPatchSTU3Resources
      summary: Apply FHIRPatch for STU3 resources
      tags:
      - FHIR
      parameters:
      - name: fhir_version
