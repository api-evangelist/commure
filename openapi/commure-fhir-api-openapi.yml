  /api/v1/{fhir_version}/Observation/$lastn:
    get:
      operationId: lastNObservationsQuery
      summary: Last N Observations Query
      description: 'The *lastn query* meets the common need for searching for the most recent or last n=number of observations for a subject. For example, retrieving the last 5 temperatures for a patient to view trends or fetching the most recent laboratory results or vitals signs. To ask a server to return the last n=number of observations, the *lastn* query uses the normal search parameters defined for the Observation resource. However, rather than their normal use, they are interpreted as inputs - i.e.. instead of requiring that the resources literally contain the search parameters, they are passed to a server algorithm of some kind that uses them to determine the most appropriate matches.


        The request for a lastn query SHALL include:


        * A `$lastn` operation parameter

        * A subject using either the `patient` or `subject` search parameter

        * A `category` parameter and/or a search parameter that contains a code element in its FHIRpath expression. ( e.g., `code` or `code-value-concept`)


        The request for a lastn query MAY include:


        * Other Observation search parameters and modifiers


        The response from a lastn query is a set of observations:


        * Filtered by additional parameters

        * If not explicitly filtered by status then will include statuses of ''entered-in-error''

        * ''GROUP BY'' `Observation.code`

        * Codes SHALL be considered equivalent if the `coding.value` *and* `coding.system` are the same.

        * Text only codes SHALL be treated and grouped based on the text.

        * For codes with translations (multiple codings), the code translations are assumed to be equal and the grouping by code SHALL follow the transitive property of equality.


        for example:


        |Observation.code for observation a|Observation.code for observation b|Observation.code for observation c|number of groups [codes/text in each group]|

        |---|---|---|---|

        |a|b|c | 3 [a],[b],[c]|

        |a|b|a,c | 2 [a.c],[b]|

        |a|b|a,b | 1 [a,b]|

        |''textM''|''Text''|''t e x t''|3 [''text''],[''Text''],[''t e x t'']|


        * Sorted from most recent to the oldest

        * Limited to the number of requested responses per group specified by the optional *max* query parameter

        * In case of a tie - when the effective times for >1 Observations are equal - both will be returned. Therefore, more Observations may be returned than is specified in *max*. For example, 4 Observations instead of 3 if the 3rd and 4th most recent observation had the same effective time.

        * If no maximum number is given then only the most recent Observation in each group is returned.


        The set of returned observations should represent distinct real world observations and not the same observation with changes in status or versions. If there are no matches, the *lastn* query SHALL return an empty search set with no error, but may include an operation outcome with further advice.'
      tags:
      - FHIR
      parameters:
      - name: fhir_version
        in: path
        required: true
        description: (Required) Version of the FHIR
        schema:
          type: string
      - name: max
        in: query
        required: false
        description: '`max` is  an optional input parameter to the *lastn* query operation.  It is used to specify the maximum number of Observations to return from each group. For example for the query "Fetch the last 3 results for all vitals for a patient" `max` = 3.'
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/fhir+json:
              schema:
                type: object
        '500':
          description: Internal Server Error
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
      security:
      - SMARTonFHIR: []
      - bearerAuth: []
  /api/v1/r4/.well-known/smart-configuration:
    get:
      operationId: sMARTAppLaunchConfiguration
      summary: SMART App Launch Configuration
      description: SMART App Launch configuration.
      tags:
      - FHIR
      responses:
        '200':
          description: OK
          content:
            application/fhir+json:
              schema:
                type: object
      security:
      - SMARTonFHIR: []
      - bearerAuth: []
components:
  schemas:
    OperationOutcome:
      type: object
      description: HL7 FHIR OperationOutcome - the standard FHIR error envelope returned on 4xx/5xx.
      properties:
        resourceType:
          type: string
          const: OperationOutcome
        issue:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum:
                - fatal
                - error
                - warning
                - information
              code:
                type: string
              diagnostics:
                type: string
              details:
                type: object
              expression:
                type: array
                items:
                  type: string
  securitySchemes:
    SMARTonFHIR:
      type: oauth2
      description: OpenID Connect / SMART App Launch. Supports the authorization code (with PKCE), implicit, hybrid, client credentials and refresh token grants.
      flows:
        authorizationCode:
          authorizationUrl: https://api-{tenant-id}.developer.commure.com/auth/authorize
          tokenUrl: https://api-{tenant-id}.developer.commure.com/auth/token
          refreshUrl: https://api-{tenant-id}.developer.commure.com/auth/token
          scopes:
            openid: OpenID Connect authentication; returns an ID token.
            profile: OpenID Connect profile claims for the authenticated user.
            email: OpenID Connect email claim for the authenticated user.
            launch: SMART EHR launch context.
            offline_access: Request a refresh token for long-lived access.
        clientCredentials:
          tokenUrl: https://api-{tenant-id}.developer.commure.com/auth/token
          scopes: {}
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token issued by the Commure Authentication API, presented as a bearer token (tokens are prefixed "Sec-").
