publishes_limits: false
summary: >-
  Commure publishes no numeric rate limits and no rate-limit response headers. The Developer User
  Agreement (last revised 2024-10-10) acknowledges that limits EXIST - "The Developer Services may
  be subject to limitations, such as limits on storage space or the number of calls you are
  permitted to make against our APIs. You must not exceed or circumvent any limitations" - but
  states no window, no ceiling, no burst allowance and no per-scope breakdown. The published
  contract declares 400, 401, 404, 405, 409, 410, 412, 422 and 500 responses and does NOT declare
  429, so a client has no documented signal for exhaustion. Limits are presumably set per tenant
  under the health-system contract.
