  registry: https://npm.developer.commure.com/
  auth_required: true
  cdn: false
  note: >-
    No CDN/script-tag or unpkg/jsDelivr distribution exists - the library was never published to a
    public registry, so there is no loader URL to record. Installation required authenticated yarn
    credentials issued under the Commure Developer User Agreement.
  status: unavailable
  status_note: >-
    npm.developer.commure.com is NXDOMAIN and every @commure package 404s on registry.npmjs.org as
    of 2026-08-15; the library cannot be installed today.
