summary: >-
  Commure shipped a first-party client-side component library for building clinical SMART on FHIR
  applications on top of the Commure Developer Platform: a React component suite (@commure/components-*)
  bound to a FHIR data layer, plus a code-generation path that renders components from FHIR
  StructureDefinitions. This is distinct from the SDK/client packages in packages/ - these are
  renderable UI surfaces a developer embeds in their own app, not transport clients. The evidence
  is Commure's own public demo application, the finished result of its "Patient Chart Demo App"
  tutorial, which composes the library into a working patient chart.
distribution:
