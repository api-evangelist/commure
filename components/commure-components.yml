  description: >-
    Generates components from a Commure-defined DSL over FHIR StructureDefinitions, so a component
    surface can be derived from a profile rather than hand-written.
- name: '@commure/autogen-dsl'
  version: 0.1.12
  description: PEG-based parser for the autogen DSL.
