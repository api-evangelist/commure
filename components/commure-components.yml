  version: 0.1.12
  role: >-
    SMART App Launch bootstrap - performs the EHR/standalone launch handshake and supplies the
    authenticated FHIR context the components render against. This is the entry point, the nearest
    equivalent to a loader script in a hosted component product.
- name: '@commure/smart-new'
  version: 0.1.12
  role: Newer SMART launch implementation carried alongside smart-core in the same release.
